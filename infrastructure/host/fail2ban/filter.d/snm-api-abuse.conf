# ==============================================================================
# Filtro Fail2ban para detectar peticiones abusivas (HTTP 429) en Nginx
# Proyecto Andalucía Mesh
# ==============================================================================

[Definition]
# Coincidencia con líneas de log de Nginx donde el código HTTP devuelto es 429 (Too Many Requests)
failregex = ^<HOST> - \S+ \[.*?\] "[^"]*" 429 \d+ "[^"]*" "[^"]*"
ignoreregex =
