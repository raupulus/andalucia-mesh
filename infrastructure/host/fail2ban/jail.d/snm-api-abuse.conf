# ==============================================================================
# Cárcel Fail2ban para mitigar scraping abusivo sobre la API del portal
# Proyecto Andalucía Mesh
# ==============================================================================

[snm-api-abuse]
enabled  = true
port     = http,https
filter   = snm-api-abuse
logpath  = /var/log/nginx/access.log

# Si una misma IP acumula 10 respuestas HTTP 429 en un minuto, se bloquea por 1 hora
maxretry = 10
findtime = 60
bantime  = 3600

# Bloqueo mediante UFW en puertos HTTP y HTTPS
banaction = ufw
