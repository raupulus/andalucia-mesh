# Configuración de optimización de kernel para Andalucía Mesh
# Ajustes de red, memoria y descriptores de archivo para alta concurrencia

# Aumentar la cola de conexiones pendientes en sockets TCP
net.core.somaxconn = 4096

# Aumentar el backlog de paquetes SYN entrantes (mitigación de ráfagas SYN)
net.ipv4.tcp_max_syn_backlog = 4096

# Rango de puertos locales para conexiones salientes de sockets
net.ipv4.ip_local_port_range = 10240 65535

# Aumentar el número máximo de áreas de memoria mapeadas (necesario para bases de datos)
vm.max_map_count = 262144

# Aumentar el límite global de descriptores de archivos del sistema
fs.file-max = 2097152
