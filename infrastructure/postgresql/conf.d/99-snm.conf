# ==============================================================================
# 99-snm.conf
# Optimización de PostgreSQL 17 + TimescaleDB para Andalucía Mesh
# Carga de referencia: 4 vCPU, 8 GB RAM, almacenamiento SSD
# ==============================================================================

# Conexiones y Red
# Escucha en loopback, en el gateway de Docker mesh (172.30.0.1) y en la VPN WireGuard (10.8.0.1)
listen_addresses = 'localhost, 172.30.0.1, 10.8.0.1'
max_connections = 150
password_encryption = scram-sha-256

# Extensión TimescaleDB
shared_preload_libraries = 'timescaledb'
timescaledb.max_background_workers = 16

# Gestión de Memoria (ajustado para ~8 GB de RAM física con zRAM)
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 13MB

# Checkpoints y WAL
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 4GB

# Optimizador de Consultas y Planificador para disco SSD
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
