# ==============================================================================
# snm-mqtts.conf
# Terminación TLS en Nginx (módulo stream) para el puerto 8883 de Mosquitto
# Marcador de plantilla: mqtt.mesh.example.org -> reemplazado por mqtt.${PROJECT_DOMAIN}
# ==============================================================================

server {
    listen 8883 ssl;
    listen [::]:8883 ssl;

    # Certificados Let's Encrypt para el subdominio de MQTT
    ssl_certificate     /etc/letsencrypt/live/mqtt.mesh.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.mesh.example.org/privkey.pem;

    # Protocolos TLS admitidos
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reenvío en plano hacia Mosquitto nativo en el host
    proxy_pass 127.0.0.1:1883;

    # Timeouts para sesiones persistentes de gateways de radio
    proxy_connect_timeout 10s;
    proxy_timeout         24h;
}
