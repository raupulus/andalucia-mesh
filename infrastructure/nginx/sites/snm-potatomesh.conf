# ==============================================================================
# snm-potatomesh.conf
# Configuración de Nginx para PotatoMesh con soporte SSE sin búfer
# Marcador de plantilla: potato.mesh.example.org -> reemplazado por potato.${PROJECT_DOMAIN}
# ==============================================================================

# Servidor HTTP para PotatoMesh (compatible con retos ACME y proxy Cloudflare Flexible/Full)
server {
    listen 80;
    listen [::]:80;
    server_name potato.mesh.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:41447;
        include snippets/snm-proxy.conf;

        # Ajustes obligatorios para Server-Sent Events (SSE /api/events) en tiempo real
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Servidor principal HTTPS para PotatoMesh
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name potato.mesh.example.org;

    ssl_certificate     /etc/letsencrypt/live/potato.mesh.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potato.mesh.example.org/privkey.pem;

    include snippets/snm-security.conf;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:41447;
        include snippets/snm-proxy.conf;

        # Ajustes obligatorios para Server-Sent Events (SSE /api/events) en tiempo real
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
