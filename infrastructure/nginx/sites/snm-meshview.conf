# ==============================================================================
# snm-meshview.conf
# Configuración de Nginx para MeshView (visor técnico de paquetes y rutas)
# Marcador de plantilla: meshview.example.org -> reemplazado por ${MESHVIEW_DOMAIN}
# ==============================================================================

# Servidor HTTP para MeshView (compatible con retos ACME y proxy Cloudflare Flexible/Full)
server {
    listen 80;
    listen [::]:80;
    server_name meshview.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /packet/\nDisallow: /packet_list/\nDisallow: /traceroute/\nDisallow: /graph/\nDisallow: /api/\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /robots.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><robots><sitemap>https://$host/sitemap.xml</sitemap><rules><user-agent>*</user-agent><disallow>/packet/</disallow><disallow>/packet_list/</disallow><disallow>/traceroute/</disallow><disallow>/graph/</disallow><disallow>/api/</disallow></rules></robots>';
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://$host/</loc><changefreq>daily</changefreq><priority>1.0</priority></url></urlset>';
    }

    # Descartar peticiones erróneas originadas por el rastreo estático de template literals JS (${...} o %24%7B...)
    location ~* (\$\{|\%24\%7B) {
        return 410;
    }

    # Cabecera noindex preventiva para paquetes y trazas técnicas de radio
    location ~* ^/(packet|packet_list|traceroute|graph)/ {
        include snippets/snm-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }
}

# Servidor principal HTTPS para MeshView
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meshview.example.org;

    ssl_certificate     /etc/letsencrypt/live/meshview.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshview.example.org/privkey.pem;

    include snippets/snm-security.conf;
    client_max_body_size 2m;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /packet/\nDisallow: /packet_list/\nDisallow: /traceroute/\nDisallow: /graph/\nDisallow: /api/\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /robots.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><robots><sitemap>https://$host/sitemap.xml</sitemap><rules><user-agent>*</user-agent><disallow>/packet/</disallow><disallow>/packet_list/</disallow><disallow>/traceroute/</disallow><disallow>/graph/</disallow><disallow>/api/</disallow></rules></robots>';
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://$host/</loc><changefreq>daily</changefreq><priority>1.0</priority></url></urlset>';
    }

    # Descartar peticiones erróneas originadas por el rastreo estático de template literals JS (${...} o %24%7B...)
    location ~* (\$\{|\%24\%7B) {
        return 410;
    }

    # Cabecera noindex preventiva para paquetes y trazas técnicas de radio
    location ~* ^/(packet|packet_list|traceroute|graph)/ {
        include snippets/snm-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }
}
