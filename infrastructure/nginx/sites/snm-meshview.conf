# ==============================================================================
# snm-meshview.conf
# Configuración de Nginx para MeshView (visor técnico de paquetes y rutas)
# Marcador de plantilla: meshview.mesh.example.org -> reemplazado por ${MESHVIEW_DOMAIN}
# ==============================================================================

# Servidor HTTP para MeshView (compatible con retos ACME y proxy Cloudflare Flexible/Full)
server {
    listen 80;
    listen [::]:80;
    server_name meshview.mesh.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location = /robots.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><robots><sitemap>https://$host/sitemap.xml</sitemap><rules><user-agent>*</user-agent><allow>/</allow></rules></robots>';
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://$host/</loc><changefreq>daily</changefreq><priority>1.0</priority></url></urlset>';
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }
}

# Servidor principal HTTPS para MeshView
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meshview.mesh.example.org;

    ssl_certificate     /etc/letsencrypt/live/meshview.mesh.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshview.mesh.example.org/privkey.pem;

    include snippets/snm-security.conf;
    client_max_body_size 2m;

    location = /robots.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><robots><sitemap>https://$host/sitemap.xml</sitemap><rules><user-agent>*</user-agent><allow>/</allow></rules></robots>';
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://$host/</loc><changefreq>daily</changefreq><priority>1.0</priority></url></urlset>';
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include snippets/snm-proxy.conf;
    }
}
