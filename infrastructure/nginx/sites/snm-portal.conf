# ==============================================================================
# snm-portal.conf
# Configuración de Nginx para el Portal Web, API y WebSocket de Andalucía Mesh
# Marcador de plantilla: mesh.example.org -> reemplazado por ${PROJECT_DOMAIN}
# Compatible con proxy Cloudflare (Flexible/Full) y certificados Let's Encrypt.
# ==============================================================================

# Servidor HTTP (puerto 80: compatible con retos ACME y proxy Cloudflare)
server {
    listen 80;
    listen [::]:80;
    server_name mesh.example.org;

    # Validación ACME HTTP-01 de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Chat en directo por WebSocket (chat-ws en puerto 8090)
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        include snippets/snm-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API REST pública con limitación de peticiones (Rate Limiting)
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        include snippets/snm-proxy.conf;
        limit_req zone=snm_api burst=20 nodelay;
    }

    # Portal Web principal
    location / {
        proxy_pass http://127.0.0.1:8100;
        include snippets/snm-proxy.conf;
    }
}

# Servidor principal HTTPS (puerto 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesh.example.org;

    # Certificados SSL de Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/mesh.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mesh.example.org/privkey.pem;

    # Cabeceras de seguridad y límites
    include snippets/snm-security.conf;
    client_max_body_size 2m;

    # Chat en directo por WebSocket (chat-ws en puerto 8090)
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        include snippets/snm-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API REST pública con limitación de peticiones (Rate Limiting)
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        include snippets/snm-proxy.conf;
        limit_req zone=snm_api burst=20 nodelay;
    }

    # Portal Web principal (PHP/Laravel en puerto 8100)
    location / {
        proxy_pass http://127.0.0.1:8100;
        include snippets/snm-proxy.conf;
    }
}
