# ==============================================================================
# snm-proxy.conf
# Cabeceras estándar de proxy inverso para Andalucía Mesh
# ==============================================================================

proxy_http_version 1.1;

# Cabeceras de host y enrutamiento
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# Se sustituye X-Forwarded-For con la IP real directa; nunca se encadena lo que mande el cliente
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Timeouts estándar de conexión y lectura
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
