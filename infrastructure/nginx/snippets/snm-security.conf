# ==============================================================================
# snm-security.conf
# Cabeceras de endurecimiento y seguridad HTTP para Andalucía Mesh
# ==============================================================================

# HSTS (HTTP Strict Transport Security): 2 años, incluye subdominios y precarga
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevenir ataques basados en confusión de tipos MIME
add_header X-Content-Type-Options "nosniff" always;

# Proteger contra clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Control de fuga de información de origen en enlaces
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
