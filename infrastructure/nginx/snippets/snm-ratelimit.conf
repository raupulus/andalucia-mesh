# ==============================================================================
# snm-ratelimit.conf
# Definición de zonas de rate limiting para Andalucía Mesh
# ==============================================================================

# Zona de limitación para la API pública: 60 peticiones por minuto por IP binaria
limit_req_zone $binary_remote_addr zone=snm_api:10m rate=60r/m;

# Código HTTP devuelto al exceder la cuota (capturado por Fail2ban)
limit_req_status 429;
