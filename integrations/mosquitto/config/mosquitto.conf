# ==============================================================================
# mosquitto.conf (integrations/mosquitto/config/)
#
# Configuración canónica del broker Mosquitto para Andalucía Mesh.
# Este archivo se enlaza o copia a /etc/mosquitto/conf.d/snm.conf en el host Debian.
#
# Principios de diseño:
# 1. per_listener_settings true: aislamiento estricto de credenciales y ACLs.
# 2. Listener 1883: público en host (gateways directos y destino local de TLS 8883).
# 3. Listener 1884: interno en 172.30.0.1 (servicios Docker en red mesh).
# 4. Listener 1885: local en 127.0.0.1 (vigilancia y salud del sistema).
# ==============================================================================

per_listener_settings true

# Persistencia en disco
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 1800
persistent_client_expiration 1d

# Límites de seguridad y capacidad
max_packet_size 16384
max_queued_messages 10000
sys_interval 10

# Logging centralizado en syslog y stdout con marcas ISO 8601
log_dest syslog
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ

# ------------------------------------------------------------------------------
# Listener 1: Público para Gateways (IPv4 e IPv6) y reenvío desde Nginx TLS 8883
# ------------------------------------------------------------------------------
listener 1883
allow_anonymous false
password_file /srv/mosquitto/credenciales/passwd-gateways
acl_file /srv/mosquitto/credenciales/acl-gateways
max_connections 200

# ------------------------------------------------------------------------------
# Listener 2: Interno para Microservicios (SOLO IP gateway red mesh 172.30.0.1)
# ------------------------------------------------------------------------------
listener 1884 172.30.0.1
allow_anonymous false
password_file /srv/mosquitto/credenciales/passwd-servicios
acl_file /srv/mosquitto/credenciales/acl-servicios
max_connections 50

# ------------------------------------------------------------------------------
# Listener 3: Diagnóstico y Salud Local (SOLO loopback 127.0.0.1)
# ------------------------------------------------------------------------------
listener 1885 127.0.0.1
allow_anonymous true
acl_file /srv/mosquitto/credenciales/acl-local
