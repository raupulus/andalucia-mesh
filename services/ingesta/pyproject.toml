[project]
name = "snm-ingesta"
version = "0.1.0"
description = "Microservicio de ingesta, descifrado, deduplicación y persistencia de tráfico Meshtastic para Andalucía Mesh"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3.0",
    "meshtastic>=2.5.0",
    "protobuf>=5.29.0",
    "cryptography>=44.0.0",
    "asyncpg>=0.30.0",
    "shapely>=2.0.0",
    "aiohttp>=3.11.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
