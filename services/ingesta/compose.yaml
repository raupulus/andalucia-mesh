# ==============================================================================
# compose.yaml (services/ingesta/)
#
# Despliegue del microservicio de ingesta para Andalucía Mesh.
# Microservicio interno en red 'mesh' sin puertos publicados hacia el host.
# ==============================================================================

services:
  ingesta:
    build:
      context: .
      dockerfile: Dockerfile
    image: snm-ingesta:0.1.0
    container_name: ingesta
    restart: unless-stopped
    networks:
      - mesh
    env_file:
      - path: /srv/comun/.env
        required: false
      - path: /srv/ingesta/.env
        required: false
      - path: .env
        required: false
    volumes:
      - ./polygons:/app/polygons:ro
    stop_grace_period: 30s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

networks:
  mesh:
    external: true
