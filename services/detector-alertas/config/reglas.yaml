# ==============================================================================
# Catálogo y Parámetros de Reglas para Andalucía Mesh
# ==============================================================================

general:
  seguimiento_dias: 7          # routers y gateways vigilados si se oyeron en este plazo
  historia_minima_h: 24        # sin esta historia, solo mínimos fijos
  reapertura_min: 60           # ventana de reapertura (mismo ID de alerta)
  actualizacion_min: 15        # intervalo mínimo para actualizaciones a la baja
  nodos_max_lista: 500         # tope máximo de IDs en alertas de malla (all)

# --- Reglas de Supervisión Activas ---
reboot-loop:
  activa: true
  ventana_media_min: 5
  umbral_medio: 3              # 3 reinicios en 5 min -> riesgo medio
  ventana_alta_min: 10
  umbral_alto: 5               # >= 5 reinicios en 10 min -> riesgo alto (alerta roja)
  resolver_min: 30             # se sanea a los 30 min sin nuevos reinicios
  uptime_arranque_s: 180

battery-low:
  activa: true
  muestras_minimas: 2
  resolver: 60                 # recuperación al superar 60%
  umbral:
    infraestructura:
      medio: 60                # router < 60% -> medio
      alto: 40                 # router < 40% -> alto (crítico)
    clientes:
      bajo: 35                 # cliente < 35% -> bajo
      medio: 15                # cliente < 15% -> medio

chutil-high:
  activa: true
  bajo: 20.0                   # canal > 20% -> bajo
  medio: 30.0                  # canal > 30% -> medio
  alto: 40.0                   # canal > 40% -> alto
  resolver: 18.0
  peso_routers: 0.6            # 60% peso cálculo a routers
  peso_clientes: 0.4           # 40% peso cálculo a clientes

text-flood:
  activa: true
  ventana_s: 60
  umbral_bajo: 5               # > 5 mensajes en 1 min -> bajo
  umbral_medio: 6              # 6 a 10 mensajes en 1 min -> medio
  umbral_alto: 10              # > 10 mensajes en 1 min -> alto
  resolver_min: 5

telemetry-burst:
  activa: true
  ventana_1m_s: 60
  umbral_1m_bajo: 2            # >= 2 en 1 min -> bajo (ráfaga combinada o acelerada)
  ventana_1h_s: 3600
  umbral_1h_alto: 50           # > 50 emisiones por hora -> alto
  resolver_min: 15

poll-abuse:
  activa: true
  ventana_min: 15
  umbral_bajo: 1               # 1 sondeo broadcast -> bajo
  umbral_medio: 3              # >= 3 en 15 min -> medio
  umbral_alto: 5               # >= 5 en 15 min -> alto
  resolver_min: 30

sunset-battery:
  activa: true
  hora_evaluacion: 20          # 20:00 h locales peninsulares
  umbral_medio: 60             # router < 60% al anochecer -> medio
  umbral_alto: 40              # router < 40% al anochecer -> alto
  resolver: 60
  tz: Europe/Madrid

traceroute-flood:
  activa: true
  ventana_min: 30
  umbral_medio: 10             # 10 a 19 en 30 min -> medio
  umbral_alto: 20              # >= 20 en 30 min -> alto
  resolver_min: 30

private-chaff:
  activa: true
  ventana_10m_min: 10
  umbral_10m_medio: 10         # > 10 paquetes privados en 10 min -> medio
  ventana_1h_min: 60
  umbral_1h_medio: 30          # > 30 paquetes privados por hora -> medio
  umbral_1h_alto: 60           # > 60 paquetes privados por hora -> alto
  resolver_min: 30

position-flood:
  activa: true
  ventana_5m_min: 5
  umbral_5m_bajo: 4            # >= 4 en 5 min -> bajo
  ventana_10m_min: 10
  umbral_10m_medio: 8          # >= 8 en 10 min -> medio
  ventana_15m_min: 15
  umbral_15m_alto: 20          # >= 20 en 15 min -> alto
  resolver_min: 30

router-role:
  activa: true
  routers_coordinados: []      # IDs de routers coordinados aprobados en Andalucía

infra-silent:
  activa: true
  medio:
    minimo_h: 6
    factor_intervalo: 3
  alto_h: 24

gateway-offline:
  activa: true
  medio:
    minimo_min: 15
    factor_intervalo: 3
  alto_min: 120

flood:
  activa: true
  ventana_min: 10
  excluir:
    - routing
  resolver_min: 30
  medio:
    minimo: 30
    factor_ritmo: 5
  alto:
    minimo: 100
    factor_ritmo: 15

rafaga-masiva:
  activa: true
  ventana_s: 120
  nodos_minimos: 50
  factor_linea_base: 5
  resolver_min: 15

hops-high:
  activa: true
  bajo_desde: 6
  alto_desde: 7
  resolver_paquetes: 2

airtime-high:
  activa: true
  bajo: 4.0
  medio: 6.0
  alto: 8.0
  resolver: 3.0

gateway-no-traffic:
  activa: true
  ventana_s: 3600             # 1 hora conectada sin recepciones LoRa
  resolver_recepciones: 1     # se resuelve al recibir tráfico de radio

key-security:
  activa: true
  min_bytes_unicos: 16        # menos de 16 bytes únicos sobre 32 -> entropía sospechosa

router-moving:
  activa: true
  umbral_km: 5.0              # 5 km de desplazamiento en 24h
  ventana_h: 24               # 24 horas
  resolver_km: 3.0            # saneamiento cuando la dispersión cae a <= 3 km

router-cluster:
  activa: true
  umbral_routers: 3           # >= 3 routers vecinos directos -> riesgo medio
  ventana_h: 24
  resolver_routers: 2

asymmetric-link:
  activa: true
  delta_snr_db: 6.0           # diferencia de SNR > 6 dB en direcciones opuestas
  ventana_h: 24               # ventana temporal de 24 horas
  resolver_db: 4.0            # saneamiento cuando delta SNR <= 4 dB

# --- Reglas de Ampliación Futuras (Inactivas hasta telemetría específica) ---
battery-drain:
  activa: false
  voltaje_vacio: 3.3
  dias_proyeccion: 3
  ventana_h: 72


tx-dropped:
  activa: false
  medio_por_hora: 20
  resolver_min: 120

noise-high:
  activa: false
  db_sobre_mediana: 10
  duracion_min: 60
  resolver_db: 5

config-intervals:
  activa: false
  tolerancia: 0.5
  muestras_minimas: 3
  resolver_h: 24
  movil_desde_m: 500
  recomendado_h:
    nodeinfo: 72
    posicion_fijo: 72
    posicion_movil: 1
    telemetria_dispositivo: 4
    telemetria_entorno: 4
  telemetria_energia:
    maximo_24h: 2

new-node-burst:
  activa: false
  minimo: 20
  factor_linea_base: 5
  ventana_min: 10
  resolver_min: 60

mqtt-into-rf:
  activa: false
  paquetes_minimos: 5
  ventana_min: 60
  resolver_h: 6

ok-to-mqtt-violation:
  activa: false
  paquetes_minimos: 3
  ventana_h: 24
  resolver_h: 24

impossible-jump:
  activa: false
  velocidad_kmh: 300
  distancia_minima_km: 1
  resolver_h: 24

duplicate-pubkey:
  activa: false
  ventana_dias: 7

identity-conflict:
  activa: false
  ventana_h: 24

# Silencios temporales de reglas o nodos
silencios: []
