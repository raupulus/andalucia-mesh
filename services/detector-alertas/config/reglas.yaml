# ==============================================================================
# Catálogo y Parámetros de Reglas para Andalucía Mesh
# ==============================================================================

general:
  seguimiento_dias: 7          # routers y gateways vigilados si se oyeron en este plazo
  historia_minima_h: 24        # sin esta historia, solo mínimos fijos
  reapertura_min: 60           # ventana de reapertura (mismo ID de alerta)
  actualizacion_min: 15        # intervalo mínimo para actualizaciones a la baja
  nodos_max_lista: 500         # tope máximo de IDs en alertas de malla (all)

# --- Reglas MVP (Activas) ---
reboot-loop:
  activa: true
  ventana_min: 60
  uptime_arranque_s: 180
  resolver_min: 120
  umbral:
    infraestructura:
      alto: 3
    clientes:
      bajo: 3

battery-low:
  activa: true
  muestras_minimas: 2
  resolver: 50
  umbral:
    infraestructura:
      medio: 40
      alto: 20
    clientes:
      bajo: 20

infra-silent:
  activa: true
  medio:
    minimo_h: 6
    factor_intervalo: 3
  alto_h: 24

gateway-offline:
  activa: true
  medio:
    minimo_min: 15
    factor_intervalo: 3
  alto_min: 120

flood:
  activa: true
  ventana_min: 10
  excluir:
    - routing
  resolver_min: 30
  medio:
    minimo: 30
    factor_ritmo: 5
  alto:
    minimo: 100
    factor_ritmo: 15

rafaga-masiva:
  activa: true
  ventana_s: 120
  nodos_minimos: 50
  factor_linea_base: 5
  resolver_min: 15

hops-high:
  activa: true
  medio_desde: 6
  resolver_paquetes: 2

# --- Reglas de Ampliación (Inactivas hasta calibración con telemetría real) ---
battery-drain:
  activa: false
  voltaje_vacio: 3.3
  dias_proyeccion: 3
  ventana_h: 72

chutil-high:
  activa: false
  medio: 20
  alto: 40
  resolver: 20
  muestras_minimas: 2

airtime-high:
  activa: false
  medio: 7
  alto: 10
  resolver: 5

tx-dropped:
  activa: false
  medio_por_hora: 20
  resolver_min: 120

noise-high:
  activa: false
  db_sobre_mediana: 10
  duracion_min: 60
  resolver_db: 5

text-flood:
  activa: false
  mensajes: 10
  ventana_min: 5
  resolver_min: 30

config-intervals:
  activa: false
  tolerancia: 0.5
  muestras_minimas: 3
  resolver_h: 24
  movil_desde_m: 500
  recomendado_h:
    nodeinfo: 72
    posicion_fijo: 72
    posicion_movil: 1
    telemetria_dispositivo: 4
    telemetria_entorno: 4
  telemetria_energia:
    maximo_24h: 2

router-role:
  activa: false
  routers_coordinados: []

new-node-burst:
  activa: false
  minimo: 20
  factor_linea_base: 5
  ventana_min: 10
  resolver_min: 60

mqtt-into-rf:
  activa: false
  paquetes_minimos: 5
  ventana_min: 60
  resolver_h: 6

ok-to-mqtt-violation:
  activa: false
  paquetes_minimos: 3
  ventana_h: 24
  resolver_h: 24

impossible-jump:
  activa: false
  velocidad_kmh: 300
  distancia_minima_km: 1
  resolver_h: 24

duplicate-pubkey:
  activa: false
  ventana_dias: 7

identity-conflict:
  activa: false
  ventana_h: 24

# Silencios temporales de reglas o nodos
silencios: []
