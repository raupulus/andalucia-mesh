<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#1F2029"/>
  <rect x="20" y="20" width="360" height="360" rx="20" fill="#2C2D3C" stroke="#3D3E4D" stroke-width="3"/>
  <rect x="110" y="100" width="180" height="190" rx="8" fill="#1E3150" stroke="#8D8EA6" stroke-width="6"/>
                   <!-- Solar cells grid -->
                   <line x1="170" y1="100" x2="170" y2="290" stroke="#8D8EA6" stroke-width="3"/>
                   <line x1="230" y1="100" x2="230" y2="290" stroke="#8D8EA6" stroke-width="3"/>
                   <line x1="110" y1="160" x2="290" y2="160" stroke="#8D8EA6" stroke-width="3"/>
                   <line x1="110" y1="225" x2="290" y2="225" stroke="#8D8EA6" stroke-width="3"/>
                   <!-- Sun rays -->
                   <circle cx="200" cy="60" r="18" fill="#F59E0B"/>
                   <line x1="200" y1="30" x2="200" y2="20" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
                   <line x1="170" y1="40" x2="160" y2="30" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
                   <line x1="230" y1="40" x2="240" y2="30" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="340" fill="#F0F0F5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Panel Solar 10W 6V</text>
  <text x="200" y="360" fill="#9FA0B4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Monocristalino Templado</text>
</svg>