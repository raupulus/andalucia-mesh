# ==============================================================================
# compose.yaml (services/portal/)
#
# Despliegue del Portal Web (Laravel) y del Daemon de Tareas (portal-tareas).
# El portal web escucha en 127.0.0.1:8100 en el host para el proxy Nginx.
# Conforme a docs/info/portal/14-operator-panel.md y DT-18.
# ==============================================================================

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: snm-portal:0.1.0
    container_name: portal
    restart: unless-stopped
    networks:
      - mesh
    ports:
      - "127.0.0.1:8100:8080"
    env_file:
      - path: /srv/comun/.env
        required: false
      - path: /srv/portal/.env
        required: false
      - path: .env
        required: false
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  portal-tareas:
    image: snm-portal:0.1.0
    container_name: portal-tareas
    restart: unless-stopped
    networks:
      - mesh
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: /srv/comun/.env
        required: false
      - path: /srv/portal/.env
        required: false
      - path: .env
        required: false
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - portal

networks:
  mesh:
    external: true
